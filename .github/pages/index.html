<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ElectricalPH has moved</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://electricalph.vercel.app/" />
  <meta http-equiv="refresh" content="0; url=https://electricalph.vercel.app/" />
  <script>
    // Forward to the live app, keeping the page path, query and hash (without the /Angelo prefix)
    (function () {
      var target = "https://electricalph.vercel.app";
      var path = window.location.pathname.replace(/^\/Angelo(?=\/|$)/i, "") || "/";
      if (/\/(index|404)\.html$/i.test(path)) path = path.replace(/[^/]*$/, "");
      window.location.replace(target + path + window.location.search + window.location.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
    main { text-align: center; padding: 24px; }
    a { color: #4f46e5; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>ElectricalPH</h1>
    <p>Taking you to the live app&hellip;</p>
    <p><a href="https://electricalph.vercel.app/">Open ElectricalPH</a></p>
  </main>
</body>
</html>
